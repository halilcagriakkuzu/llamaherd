name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast, GUI-free checks on every supported OS. CGO is off so no platform GUI
  # libraries are needed and the result is deterministic; the tagged GUI build
  # is verified separately below.
  cross-platform:
    name: build + test (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
          - os: macos-14
            goos: darwin
          - os: windows-latest
            goos: windows
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...

  lint:
    name: lint (gofmt + golangci-lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      # The tagged GUI files need GTK/WebKit headers to type-check.
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  # Race detector on the Linux target (tests are GPU-free and model-free).
  race:
    name: go test -race (Linux)
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go test -race ./...

  # The real GUI build only runs on Linux (the primary target); Windows/macOS
  # GUI builds are produced by the release workflow.
  gui-build-linux:
    name: build GUI (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        run: |
          mkdir -p build/bin
          CGO_ENABLED=1 go build -tags webkit2_41,desktop,production -o build/bin/llamaherd .

      - name: install.sh dry run
        run: scripts/install.sh --from-source --no-deps --dry-run
