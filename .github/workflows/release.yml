name: Release

# Builds prebuilt binaries and attaches them to a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Asset names are stable (no version in the name) so the installer can always
# fetch the newest one via /releases/latest/download/<asset>:
#
#   llamaherd_linux_amd64.tar.gz
#   llamaherd_linux_arm64.tar.gz
#   llamaherd_darwin_amd64.tar.gz
#   llamaherd_darwin_arm64.tar.gz
#   llamaherd_windows_amd64.zip
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    # arm64 Linux and native Windows are best-effort: a failure there must not
    # block the other artifacts or the release.
    continue-on-error: ${{ matrix.experimental }}
    # Tag builds stamp the version into the binary (llamaherd version).
    env:
      # Wails' macOS webview needs UTType (UniformTypeIdentifiers); the
      # `runner` context is unavailable at job level, so key off matrix.os.
      CGO_LDFLAGS: ${{ startsWith(matrix.os, 'macos') && '-framework UniformTypeIdentifiers' || '' }}
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: llamaherd_linux_amd64
            tags: webkit2_41,desktop,production
            bin: llamaherd
            experimental: false
          - os: ubuntu-24.04-arm
            asset: llamaherd_linux_arm64
            tags: webkit2_41,desktop,production
            bin: llamaherd
            experimental: true
          - os: macos-15-intel
            asset: llamaherd_darwin_amd64
            tags: desktop,production
            bin: llamaherd
            experimental: true
          - os: macos-14
            asset: llamaherd_darwin_arm64
            tags: desktop,production
            bin: llamaherd
            experimental: true
          - os: windows-latest
            asset: llamaherd_windows_amd64
            tags: desktop,production
            bin: llamaherd.exe
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          CGO_ENABLED=1 go build -tags "${{ matrix.tags }}" -ldflags "-X main.version=${VERSION}" -o "dist/package/${{ matrix.bin }}" .
          cp assets/llamaherd.png LICENSE README.md dist/package/
          [ -d configs ] && cp -r configs dist/package/ || true

      # Wails v2 on Windows needs no cgo (WebView2 loader is embedded).
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          go build -tags "${{ matrix.tags }}" -ldflags "-X main.version=$env:VERSION" -o "dist/package/${{ matrix.bin }}" .
          Copy-Item assets/llamaherd.png, LICENSE, README.md dist/package/
          if (Test-Path configs) { Copy-Item -Recurse configs dist/package/ }

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C dist/package -czf "dist/${{ matrix.asset }}.tar.gz" .

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/package/* -DestinationPath "dist/${{ matrix.asset }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.zip
          if-no-files-found: ignore

  release:
    name: publish release
    needs: build
    # Publish whatever built (best-effort targets may have failed).
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
